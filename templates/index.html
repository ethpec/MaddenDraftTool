<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madden Draft Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace'],
          },
          colors: {
            ink: { 950: '#06080d', 900: '#0b0e15', 800: '#11151f', 700: '#1a2030', 600: '#252d42' },
            accent: { 400: '#f8c043', 500: '#f0b020', 600: '#c98c0a' },
            field: { 500: '#22c55e' },
          },
        },
      },
    };
  </script>
</head>
<body class="bg-ink-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Setup gate (hidden once a session starts) -->
  <div id="setup" class="fixed inset-0 z-40 flex items-center justify-center bg-ink-950">
    <div class="w-full max-w-md rounded-xl border border-ink-700 bg-ink-900 p-8 shadow-2xl">
      <h1 class="text-2xl font-bold tracking-tight">Madden Draft Tool</h1>
      <p class="mt-1 text-sm text-slate-400">Pick a draft year and which team you'll control.</p>
      <div class="mt-6 space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs uppercase tracking-wider text-slate-400">Draft Year</label>
          <select id="year-select" class="w-full rounded-md border border-ink-600 bg-ink-800 px-3 py-2 text-sm text-slate-100 focus:border-accent-500 focus:outline-none"></select>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs uppercase tracking-wider text-slate-400">Your Team</label>
          <div id="team-grid" class="team-grid pretty-scroll"></div>
        </div>
        <button id="start-btn" class="w-full rounded-md bg-accent-500 px-4 py-2 text-sm font-semibold text-ink-950 hover:bg-accent-400 transition disabled:opacity-50">Start Draft</button>
      </div>
      <div id="setup-status" class="mt-3 text-xs text-slate-500 min-h-[1rem]"></div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="sticky top-0 z-30 border-b border-ink-700 bg-ink-900/95 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] items-center justify-between px-6 py-3">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded bg-accent-500 grid place-items-center text-ink-950 font-bold">M</div>
          <div>
            <div class="text-sm font-semibold leading-none">Madden Draft Tool</div>
            <div class="text-[11px] uppercase tracking-wider text-slate-400" id="header-year"></div>
          </div>
        </div>
        <button class="select-player-btn" data-action="open-big-board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="9" x2="9" y2="20"/>
          </svg>
          <span>Big Board</span>
        </button>
        <button class="trade-hub-header-btn" data-action="trade-hub">
          <span class="trade-hub-phone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span>Trade Hub</span>
          <span id="trade-hub-header-badge" class="trade-hub-badge hidden">0</span>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <button class="sim-btn" data-action="sim-pick">Sim Pick</button>
        <button class="sim-btn" data-action="sim-until-user">Sim to My Pick</button>
        <select id="sim-round-select" class="sim-select" aria-label="Sim to round">
          <option value="" disabled selected>Sim to Round…</option>
        </select>
        <button class="sim-btn" data-action="open-board-zoom">Full Draft Order</button>
        <button class="primary-btn" data-action="export">Export</button>
      </div>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-[1600px] px-6 py-6 grid grid-cols-12 gap-6 hidden">

    <!-- Left column: on-the-clock + last pick -->
    <section class="col-span-3 space-y-6">
      <div class="card">
        <div class="card-eyebrow">On The Clock</div>
        <div class="mt-2 flex items-center gap-3">
          <div id="on-the-clock-logo" class="flex-shrink-0"></div>
          <div class="min-w-0">
            <div id="on-the-clock-team" class="text-2xl font-bold tracking-tight truncate"></div>
            <div id="on-the-clock-meta" class="mt-0.5 text-xs text-slate-400"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Last Selection</div>
        <div id="last-pick" class="mt-1 text-sm text-slate-300">—</div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Team Needs</div>
        <div id="team-needs" class="mt-2 space-y-1 text-sm"></div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Previous Selections</div>
        <div id="previous-selections" class="mt-2 space-y-1 text-sm"></div>
      </div>
    </section>

    <!-- Center column: draft board + big board -->
    <section class="col-span-6 space-y-6">
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div class="card-eyebrow">Current Round</div>
            <div id="round-title" class="text-xl font-bold tracking-tight">Round 1</div>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-xs text-slate-400">Round</label>
            <select id="round-picker" class="rounded border border-ink-600 bg-ink-800 px-2 py-1 text-xs"></select>
          </div>
        </div>
        <div id="round-grid" class="mt-4 grid grid-cols-4 gap-2"></div>
      </div>
    </section>

    <!-- Right column: team boards -->
    <section class="col-span-3 space-y-6">
      <div class="card">
        <div class="card-eyebrow">Team Big Boards <span class="text-slate-500 normal-case tracking-normal text-xs">(testing/private)</span></div>
        <select id="team-board-picker" class="mt-2 w-full rounded border border-ink-600 bg-ink-800 px-2 py-1 text-xs"></select>
        <div id="team-board" class="mt-3 max-h-[640px] overflow-y-auto pretty-scroll"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <div id="modal-root" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-6">
    <div class="w-full max-w-2xl rounded-xl border border-ink-700 bg-ink-900 p-6 shadow-2xl">
      <div class="flex items-start justify-between">
        <div>
          <div id="modal-title" class="text-lg font-semibold"></div>
          <div id="modal-subtitle" class="text-xs text-slate-400 mt-0.5"></div>
        </div>
        <button id="modal-close" class="text-slate-400 hover:text-white">&#x2715;</button>
      </div>
      <div id="modal-body" class="mt-4"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden rounded-lg border border-ink-600 bg-ink-800 px-4 py-2 text-sm shadow-xl"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
