<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madden Draft Tool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'%3E%3Cpath d='M32 1 L60 9 V36 C60 56 47 70 32 78 C17 70 4 56 4 36 V9 Z' fill='%230b0e15' stroke='%23f0b020' stroke-width='4'/%3E%3Ctext x='32' y='53' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='30' fill='%23f0b020'%3ED%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace'],
          },
          colors: {
            ink: { 950: '#06080d', 900: '#0b0e15', 800: '#11151f', 700: '#1a2030', 600: '#252d42' },
            accent: { 400: '#f8c043', 500: '#f0b020', 600: '#c98c0a' },
            field: { 500: '#22c55e' },
          },
        },
      },
    };
  </script>
</head>
<body class="app-shell bg-ink-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Setup gate (hidden once a session starts) -->
  <div id="setup" class="setup-screen fixed inset-0 z-40 flex items-center justify-center bg-ink-950">
    <div class="setup-card w-full max-w-2xl rounded-xl border border-ink-700 bg-ink-900 p-8 shadow-2xl">
      <h1 class="text-2xl font-bold tracking-tight">Madden Draft Tool</h1>
      <p class="mt-1 text-sm text-slate-400">Pick a draft year and which team you'll control.</p>
      <div class="mt-6 space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs uppercase tracking-wider text-slate-400">Draft Year</label>
          <select id="year-select" class="w-full rounded-md border border-ink-600 bg-ink-800 px-3 py-2 text-sm text-slate-100 focus:border-accent-500 focus:outline-none"></select>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs uppercase tracking-wider text-slate-400">Your Team</label>
          <div id="team-grid" class="team-grid pretty-scroll"></div>
        </div>
        <button id="start-btn" class="w-full rounded-md bg-accent-500 px-4 py-2 text-sm font-semibold text-ink-950 hover:bg-accent-400 transition disabled:opacity-50">Start Draft</button>
      </div>
      <div id="setup-status" class="mt-3 text-xs text-slate-500 min-h-[1rem]"></div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="app-header sticky top-0 z-30 border-b border-ink-700 bg-ink-900/95 backdrop-blur">
    <div class="app-header-inner mx-auto flex max-w-[1920px] items-center justify-between px-4 py-3">
      <div class="app-header-main flex items-center gap-2">
        <div class="brand-block flex items-center gap-3">
          <div class="nfl-shield" aria-label="NFL">
            <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <!-- Outer shield with subtle gradient -->
              <defs>
                <linearGradient id="nfl-shield-grad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1d3a8a"/>
                  <stop offset="100%" stop-color="#0e1f55"/>
                </linearGradient>
              </defs>
              <path d="M32 1 L60 9 V36 C60 56 47 70 32 78 C17 70 4 56 4 36 V9 Z"
                    fill="url(#nfl-shield-grad)" stroke="#f1f5f9" stroke-width="1.5"/>
              <!-- Red horizontal band -->
              <path d="M5 21 H59 V31 H5 Z" fill="#c8102e"/>
              <!-- Stars on the band -->
              <g fill="#f1f5f9">
                <circle cx="14" cy="26" r="1.6"/>
                <circle cx="24" cy="26" r="1.6"/>
                <circle cx="34" cy="26" r="1.6"/>
                <circle cx="44" cy="26" r="1.6"/>
                <circle cx="54" cy="26" r="1.6"/>
              </g>
              <!-- NFL wordmark -->
              <text x="32" y="58" text-anchor="middle"
                    font-family="Inter, Arial, sans-serif"
                    font-weight="900" font-size="18"
                    letter-spacing="0" fill="#f1f5f9">NFL</text>
            </svg>
          </div>
          <div>
            <div class="brand-title text-sm font-semibold leading-none">Madden Draft Tool</div>
            <div class="text-[11px] uppercase tracking-wider text-slate-400" id="header-year"></div>
          </div>
        </div>
        <button class="select-player-btn" data-action="open-big-board">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="9" x2="9" y2="20"/>
          </svg>
          <span>Big Board</span>
        </button>
        <button class="trade-hub-header-btn" data-action="trade-hub">
          <span class="trade-hub-phone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span>Trade Hub</span>
          <span id="trade-hub-header-badge" class="trade-hub-badge hidden">0</span>
        </button>
        <button class="nav-tab-btn" data-action="trade-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="M3 3v5h5"/>
            <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          <span>Trade History</span>
          <span id="trade-history-count" class="nav-tab-count">0</span>
        </button>
        <button class="nav-tab-btn" data-action="rosters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Rosters/Draft Picks</span>
        </button>
        <button class="nav-tab-btn" data-action="gm-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>GM Info</span>
        </button>
        <button class="nav-tab-btn" data-action="sim-report">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>Sim Report</span>
        </button>
        <button class="nav-tab-btn" data-action="open-board-zoom">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
          <span>Full Draft Order</span>
        </button>
      </div>
      <div class="command-bar flex items-center gap-2">
        <button class="sim-btn" data-action="sim-pick">Sim Pick</button>
        <button class="sim-btn" data-action="sim-until-user">Sim to My Pick</button>
        <select id="sim-round-select" class="sim-select" aria-label="Sim to round">
          <option value="" disabled selected>Sim to Round…</option>
        </select>
        <button class="primary-btn" data-action="export">Export</button>
      </div>
    </div>
  </header>

  <main id="app" class="app-layout mx-auto max-w-[1920px] px-4 py-6 grid grid-cols-12 gap-6 hidden">

    <!-- Left column: on-the-clock + last pick -->
    <section class="left-rail col-span-3 space-y-6">
      <div class="card">
        <div class="card-eyebrow">On The Clock</div>
        <div class="mt-2 flex items-center gap-3">
          <div id="on-the-clock-logo" class="flex-shrink-0"></div>
          <div class="min-w-0">
            <div id="on-the-clock-team" class="text-2xl font-bold tracking-tight truncate"></div>
            <div id="on-the-clock-meta" class="mt-0.5 text-xs text-slate-400"></div>
          </div>
        </div>
        <div class="draft-progress" aria-hidden="true">
          <div id="draft-progress-bar" class="draft-progress-bar"></div>
        </div>
        <div id="draft-progress-meta" class="draft-progress-meta"></div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Last Selection</div>
        <div id="last-pick" class="mt-1 text-sm text-slate-300">—</div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Team Needs</div>
        <div id="team-needs" class="mt-2 space-y-1 text-sm"></div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Previous Selections</div>
        <div id="previous-selections" class="mt-2 space-y-1 text-sm"></div>
      </div>
    </section>

    <!-- Center column: draft board + big board -->
    <section class="draft-stage col-span-6 space-y-6">
      <div class="card">
        <div class="flex items-center justify-between">
          <div>
            <div class="card-eyebrow">Current Round</div>
            <div id="round-title" class="text-xl font-bold tracking-tight">Round 1</div>
          </div>
          <div id="round-picker" class="round-tabs" role="tablist" aria-label="Pick a round"></div>
        </div>
        <div id="round-grid" class="mt-4 grid grid-cols-4 gap-2"></div>
      </div>
    </section>

    <!-- Right column: team boards -->
    <section class="right-rail col-span-3 space-y-6">
      <div class="card right-picks-card">
        <div class="card-eyebrow">Your Draft Picks</div>
        <div id="user-picks-snapshot" class="user-picks-snapshot"></div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Find Teams by Need</div>
        <div id="needs-filter-pills" class="needs-filter-pills"></div>
        <div id="needs-filter-status" class="needs-filter-status"></div>
      </div>

      <div class="card">
        <div class="card-eyebrow">Team Big Boards</div>
        <select id="team-board-picker" class="mt-2 w-full rounded border border-ink-600 bg-ink-800 px-2 py-1 text-xs"></select>
        <div id="team-board" class="team-board-list pretty-scroll"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <div id="modal-root" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-6">
    <div class="modal-panel w-full max-w-2xl rounded-xl border border-ink-700 bg-ink-900 p-6 shadow-2xl">
      <div class="flex items-start justify-between">
        <div>
          <div id="modal-title" class="text-lg font-semibold"></div>
          <div id="modal-subtitle" class="text-xs text-slate-400 mt-0.5"></div>
        </div>
        <button id="modal-close" class="text-slate-400 hover:text-white">&#x2715;</button>
      </div>
      <div id="modal-body" class="mt-4"></div>
    </div>
  </div>
  <!-- Player profile overlay — sits above modal-root so the parent modal stays visible behind it -->
  <div id="player-overlay-root" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 p-6" style="z-index:60">
    <div class="modal-panel w-full rounded-xl border border-ink-700 bg-ink-900 p-6 shadow-2xl">
      <div class="flex items-start justify-between">
        <div>
          <div id="player-overlay-title" class="text-lg font-semibold"></div>
          <div id="player-overlay-subtitle" class="text-xs text-slate-400 mt-0.5"></div>
        </div>
        <button id="player-overlay-close" class="text-slate-400 hover:text-white">&#x2715;</button>
      </div>
      <div id="player-overlay-body" class="mt-4"></div>
    </div>
  </div>

  <!-- Confirm overlay — sits above everything so confirm dialogs never clobber an open modal -->
  <div id="confirm-overlay-root" class="hidden fixed inset-0 flex items-center justify-center bg-black/50 p-6" style="z-index:70">
    <div class="modal-panel w-full max-w-md rounded-xl border border-ink-700 bg-ink-900 p-6 shadow-2xl">
      <div id="confirm-overlay-title" class="text-lg font-semibold"></div>
      <div id="confirm-overlay-body" class="mt-4"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden rounded-lg border border-ink-600 bg-ink-800 px-4 py-2 text-sm shadow-xl"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
